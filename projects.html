<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects | Daye Kim</title>
  <meta name="description" content="Projects by Daye Kim: virtual entertainment, interactive concerts, social VR, and UX research.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap-wide bar">
      <a class="logo" href="index.html">Daye Kim</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="projects.html" aria-current="page">Projects</a>
        <a href="CV.pdf">CV</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1 3h-2l1-3zm0 20-1-3h2l-1 3zM2 12l3-1v2l-3-1zm20 0-3 1v-2l3 1zM4.9 4.9l2.8 1.4-1.4 1.4-1.4-2.8zm14.2 14.2-2.8-1.4 1.4-1.4 1.4 2.8zM4.9 19.1l1.4-2.8 1.4 1.4-2.8 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4 2.8-1.4z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap-wide">
    <h1 class="page-title">Projects</h1>
    <p class="page-sub">Virtual entertainment, interactive concerts, and research on how people create and connect.</p>
    <div class="project-grid" id="grid"></div>
  </main>

  <footer>
    <div class="wrap">© 2026 Daye Kim</div>
  </footer>

  <script src="js/projects.js"></script>
  <script>
    document.getElementById("grid").innerHTML = projects.map(function (p) {
      var thumb = p.cover
        ? '<img src="' + p.cover + '" alt="' + p.title + '" loading="lazy">'
        : '<div class="placeholder">' + p.title + '</div>';
      return '<a class="card" href="project.html?id=' + p.id + '">' +
        '<div class="thumb">' + thumb + '</div>' +
        '<div class="body"><p class="name">' + p.title + '</p><p class="desc">' + p.summary + '</p></div>' +
        '</a>';
    }).join("");
  </script>
</body>
</html>
